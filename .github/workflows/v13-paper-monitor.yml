name: V13.6 Paper Monitor
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v13-paper-monitor
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run BTC futures PAPER monitor
        run: python paper_v13_monitor.py
      - name: Save paper state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-v13-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update V13.6 paper monitor state"
            git push
          fi
