name: Hybrid V6 Scalping Backtest
on:
  pull_request:
    paths:
      - 'backtest_hybrid_v6_scalping.py'
      - '.github/workflows/hybrid-scalping.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python backtest_hybrid_v6_scalping.py --out results-hybrid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-scalping-results
          path: results-hybrid/
