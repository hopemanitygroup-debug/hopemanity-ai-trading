name: MTF Pro V6 90-Day Validation
on:
  workflow_dispatch:
  push:
    paths:
      - backtest_v6.py
      - .github/workflows/backtest-v6-90d.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-backtest.txt
      - run: pip install -r requirements-backtest.txt
      - name: Validate V6 on 90 days with ETH trade diagnostics
        run: python backtest_v6.py --periods 90 --out results/v6-90d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-v6-90day-validation
          path: results/
          if-no-files-found: warn
