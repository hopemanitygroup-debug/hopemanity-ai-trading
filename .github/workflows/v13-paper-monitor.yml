name: V13.6 Paper Monitor
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v13-paper-monitor
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check monitor syntax
        run: python -m py_compile paper_v13_monitor.py
      - name: Run BTC futures PAPER monitor
        id: monitor
        run: python -u paper_v13_monitor.py
      - name: Upload PAPER state for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-paper-state-${{ github.run_id }}
          path: paper-v13-state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save paper state to repository
        if: steps.monitor.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-v13-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update V13.6 paper monitor state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
