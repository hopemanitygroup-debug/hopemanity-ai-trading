name: MTF Pro V5 Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - backtest_v5.py
      - backtest_v6.py
      - .github/workflows/backtest-v5.yml
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-backtest.txt
      - run: pip install -r requirements-backtest.txt
      - name: Backtest V5 baseline BTC ETH BNB
        run: python backtest_v5.py --out results/v5
      - name: Backtest V6 experimental BTC ETH BNB
        run: python backtest_v6.py --out results/v6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-v5-v6-comparison
          path: results/
          if-no-files-found: warn
